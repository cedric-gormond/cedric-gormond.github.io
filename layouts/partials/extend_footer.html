<link rel="stylesheet" href="/css/chatbot.css">

<!-- pixel art chat bubble (Pixelarticons-inspired, inline SVG, no dependency) -->
<div class="cb-bubble" id="cb-bubble" onclick="cbToggle()" title="Ask me anything">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26"
       fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="4"  y="0"  width="16" height="2"/>
    <rect x="2"  y="2"  width="20" height="2"/>
    <rect x="0"  y="4"  width="24" height="10"/>
    <rect x="2"  y="14" width="20" height="2"/>
    <rect x="4"  y="16" width="8"  height="2"/>
    <rect x="4"  y="18" width="6"  height="2"/>
    <rect x="4"  y="20" width="4"  height="2"/>
    <rect x="4"  y="22" width="2"  height="2"/>
    <!-- dots -->
    <rect x="7"  y="8"  width="2"  height="2" fill="var(--entry, #fff)" opacity="0.85"/>
    <rect x="11" y="8"  width="2"  height="2" fill="var(--entry, #fff)" opacity="0.85"/>
    <rect x="15" y="8"  width="2"  height="2" fill="var(--entry, #fff)" opacity="0.85"/>
  </svg>
</div>

<div class="cb-widget" id="cb-widget">
  <div class="cb-header" onclick="cbToggle()">
    <span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
           fill="currentColor" shape-rendering="crispEdges" style="vertical-align:middle;margin-right:6px;">
        <rect x="4"  y="0"  width="16" height="2"/>
        <rect x="2"  y="2"  width="20" height="2"/>
        <rect x="0"  y="4"  width="24" height="10"/>
        <rect x="2"  y="14" width="20" height="2"/>
        <rect x="4"  y="16" width="8"  height="2"/>
        <rect x="4"  y="18" width="4"  height="2"/>
        <rect x="4"  y="20" width="2"  height="2"/>
      </svg>Ask me anything
    </span>
    <span style="display:flex;align-items:center;gap:10px;">
      <button class="cb-clear" id="cb-clear" title="Clear chat" onclick="event.stopPropagation();cbClear()">↺</button>
      <span class="cb-close">✕</span>
    </span>
  </div>
  <div class="cb-messages" id="cb-messages"></div>
  <div class="cb-input-row">
    <input id="cb-input" class="cb-input" type="text" maxlength="500"
      placeholder="Your question…" autocomplete="off">
    <button id="cb-send" class="cb-send">Send&nbsp;→</button>
  </div>
</div>

<script>
  window.CHATBOT_API_URL = "{{ .Site.Params.chatbotApiUrl | default "http://localhost:7860" }}";
</script>
<script src="/js/chatbot.js"></script>
